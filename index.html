                      <div className="grid grid-cols-7 gap-y-1.5 gap-x-1 text-[10px] sm:text-xs text-center font-medium">
                        {Array.from({ length: firstDayOffset }).map((_, i) => <div key={`empty-${i}`}></div>)}
                        {Array.from({ length: daysInMonth }).map((_, i) => {
                          const day = i + 1;
                          const isToday = isCurrentMonth && todayDateOnly.getDate() === day;
                          const dayCities = monthData[day] || [];
                          const hasCity = dayCities.length > 0;
                          const hasFavorite = dayCities.some(c => favoriteCityIds.includes(c.id));
                          
                          return (
                            <div 
                              key={day} 
                              onClick={(e) => {
                                if (hasCity) {
                                  e.stopPropagation();
                                  setSelectedDayInfo({ day, monthName, cities: dayCities });
                                }
                              }}
                              onKeyDown={(e) => {
                                if (hasCity && (e.key === 'Enter' || e.key === ' ')) {
                                  e.stopPropagation();
                                  setSelectedDayInfo({ day, monthName, cities: dayCities });
                                }
                              }}
                              tabIndex={hasCity ? 0 : -1}
                              title={hasCity ? dayCities.map(c => c.name).join(', ') : undefined}
                              role={hasCity ? "button" : "presentation"}
                              className={`w-6 h-6 mx-auto flex items-center justify-center rounded-full transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-1 focus-visible:ring-offset-slate-50 dark:focus-visible:ring-offset-slate-800 ${
                                isToday ? 'bg-blue-600 text-white font-bold shadow-sm ring-2 ring-blue-100 dark:ring-blue-900' 
                                : hasFavorite ? 'bg-gradient-to-br from-[#ffd700] to-yellow-500 text-yellow-950 font-bold shadow-sm ring-2 ring-[#ffd700]/50 hover:scale-110 cursor-pointer'
                                : hasCity ? 'bg-[#ffd700] text-slate-800 font-bold shadow-sm hover:scale-110 hover:ring-2 hover:ring-[#ffd700]/50 cursor-pointer' 
                                : 'text-slate-600 dark:text-slate-400 group-hover:bg-slate-100 dark:group-hover:bg-slate-600'
                              }`}
                            >
                              {day}
                            </div>
                          );
                        })}
                      </div>
                    </motion.div>
                  );
                })}
              </div>
            </div>
          );
        });

        // ==========================================
        // ГОЛОВНИЙ КОМПОНЕНТ APP
        // ==========================================
        function App() {
          const [citiesData, setCitiesData] = useState([]);
          const [isLoadingData, setIsLoadingData] = useState(true);
          const [searchQuery, setSearchQuery] = useState('');
          const debouncedQuery = useDebounce(searchQuery, 300);
          const [selectedMonth, setSelectedMonth] = useState(0);
          const [sortMode, setSortMode] = useState('date');
          
          const [viewMode, setViewMode] = useLocalStorage('city_calendar_viewMode', 'year'); 
          const [isDarkMode, setIsDarkMode] = useLocalStorage('city_calendar_theme', false);
          
          // Стейт для збереження прихованих та обраних міст
          const [hiddenCityIds, setHiddenCityIds] = useLocalStorage('city_calendar_hidden', []);
          const [favoriteCityIds, setFavoriteCityIds] = useLocalStorage('city_calendar_favorites', []);
          const [showFavoritesOnly, setShowFavoritesOnly] = useLocalStorage('city_calendar_show_favs', false);
          
          // Стейт API ключа та налаштувань
          const [userApiKey, setUserApiKey] = useLocalStorage('city_calendar_api_key', '');
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);

          // Стейт для модалок
          const [selectedDayInfo, setSelectedDayInfo] = useState(null);
          const [aiGuideCity, setAiGuideCity] = useState(null);
          const closeDayInfoRef = useRef(null);

          const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());
          const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());

          // Обробка Escape для модалки днів
          useEffect(() => {
            const handleKeyDown = (e) => {
              if (e.key === 'Escape' && selectedDayInfo && !aiGuideCity) setSelectedDayInfo(null);
              if (e.key === 'Escape' && aiGuideCity) setAiGuideCity(null);
            };
            if (selectedDayInfo || aiGuideCity) {
              window.addEventListener('keydown', handleKeyDown);
            }
            if (selectedDayInfo && !aiGuideCity) {
              setTimeout(() => closeDayInfoRef.current?.focus(), 10);
            }
            return () => window.removeEventListener('keydown', handleKeyDown);
          }, [selectedDayInfo, aiGuideCity]);

          // Fetch даних про міста при старті
          useEffect(() => {
            fetch('./cities.json')
              .then(response => {
                if (!response.ok) throw new Error('Файл не знайдено або помилка мережі');
                
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("text/html")) {
                  throw new Error('Отримано HTML замість JSON (можливо файл не знайдено)');
                }
                
                return response.json();
              })
              .then(data => {
                let parsedCities = [];
                if (Array.isArray(data)) {
                  parsedCities = data;
                } else if (data && typeof data === 'object') {
                  const possibleArray = Object.values(data).find(Array.isArray);
                  if (possibleArray) parsedCities = possibleArray;
                }

                if (parsedCities.length > 0) {
                  setCitiesData(parsedCities);
                } else {
                  throw new Error('JSON не містить масиву міст');
                }
                setIsLoadingData(false);
              })
              .catch(error => {
                console.warn('Не вдалося завантажити коректний cities.json, використовуємо запасну базу.', error);
                setCitiesData(DEFAULT_CITIES);
                setIsLoadingData(false);
              });
          }, []);

          const handleHideCity = useCallback((id) => {
            setHiddenCityIds(prev => {
              if (!prev.includes(id)) return [...prev, id];
              return prev;
            });
          }, [setHiddenCityIds]);

          const handleToggleFavorite = useCallback((id) => {
            setFavoriteCityIds(prev => {
              if (prev.includes(id)) return prev.filter(favId => favId !== id);
              return [...prev, id];
            });
          }, [setFavoriteCityIds]);

          const todayDateOnly = useMemo(() => {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            return d;
          }, []);

          const globallyFilteredCities = useMemo(() => {
            // Фільтруємо приховані міста та ті, де дата невідома (month: null)
            let filtered = citiesData.filter(city => city.month !== null && !hiddenCityIds.includes(city.id));
            
            // Фільтр "Тільки обрані"
            if (showFavoritesOnly) {
              filtered = filtered.filter(city => favoriteCityIds.includes(city.id));
            }
            
            // Фільтруємо по пошуку
            if (debouncedQuery.trim() !== '') {
              const lowerQuery = debouncedQuery.toLowerCase();
              filtered = filtered.filter(city => city.name.toLowerCase().includes(lowerQuery) || city.region.toLowerCase().includes(lowerQuery));
            }
            return filtered;
          }, [citiesData, debouncedQuery, hiddenCityIds, showFavoritesOnly, favoriteCityIds]);

          const { yearGrid, upcomingGroups } = useCalendarData(globallyFilteredCities, calendarYear, todayDateOnly);

          const groupedAndFilteredCitiesList = useMemo(() => {
            if (selectedMonth === 0) return upcomingGroups;
            return upcomingGroups
              .map(group => ({
                ...group,
                cities: group.cities.filter(c => c.month === selectedMonth)
              }))
              .filter(group => group.cities.length > 0);
          }, [upcomingGroups, selectedMonth]);

          const handlePrevMonth = useCallback(() => {
            setCalendarMonth(m => {
              if (m === 0) { setCalendarYear(y => y - 1); return 11; }
              return m - 1;
            });
          }, []);

          const handleNextMonth = useCallback(() => {
            setCalendarMonth(m => {
              if (m === 11) { setCalendarYear(y => y + 1); return 0; }
              return m + 1;
            });
          }, []);

          const handlePrevYear = useCallback(() => setCalendarYear(y => y - 1), []);
          const handleNextYear = useCallback(() => setCalendarYear(y => y + 1), []);
          
          const jumpToToday = useCallback(() => {
            setCalendarYear(todayDateOnly.getFullYear());
            setCalendarMonth(todayDateOnly.getMonth());
            setViewMode((prevMode) => (prevMode === 'list' || prevMode === 'timeline') ? 'month' : prevMode);
          }, [todayDateOnly, setViewMode]);

          // Показуємо завантаження поки дані не прийдуть
          if (isLoadingData) {
            return (
              <div className={`min-h-screen flex items-center justify-center ${isDarkMode ? 'bg-slate-900 text-white' : 'bg-slate-50 text-slate-800'}`}>
                <div className="flex flex-col items-center gap-3">
                  <Loader2 className="w-10 h-10 animate-spin text-[#0057b7] dark:text-[#4da3ff]" />
                  <p className="font-medium animate-pulse">Завантаження бази міст...</p>
                </div>
              </div>
            );
          }

          return (
            <div className={isDarkMode ? 'dark' : ''}>
              <GlobalStyles />
              <div className="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans selection:bg-yellow-300 selection:text-blue-900 dark:selection:bg-blue-600 dark:selection:text-white flex flex-col transition-colors duration-300">
                <Header 
                  searchQuery={searchQuery} debouncedQuery={debouncedQuery} setSearchQuery={setSearchQuery} 
                  viewMode={viewMode} setViewMode={setViewMode} 
                  selectedMonth={selectedMonth} setSelectedMonth={setSelectedMonth} 
                  isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode}
                  hiddenCityIds={hiddenCityIds} setHiddenCityIds={setHiddenCityIds}
                  showFavoritesOnly={showFavoritesOnly} setShowFavoritesOnly={setShowFavoritesOnly}
                  onOpenSettings={() => setIsSettingsOpen(true)}
                  sortMode={sortMode} setSortMode={setSortMode}
                />

                <main className="max-w-5xl mx-auto px-4 py-8 sm:px-6 lg:px-8 flex-grow w-full relative">
                  {(viewMode === 'timeline' || viewMode === 'list') && upcomingGroups.length > 0 && (
                    <CountdownWidget 
                      nearestCity={upcomingGroups[0]?.cities[0]} 
                      onOpenAiGuide={setAiGuideCity} 
                    />
                  )}

                  {/* Обгортка AnimatePresence для плавного перемикання між екранами */}
                  <AnimatePresence mode="wait">
                    {viewMode === 'timeline' && (
                      <motion.div key="timeline" variants={pageVariants} initial="initial" animate="animate" exit="exit">
                        <TimelineView 
                          groupedCities={groupedAndFilteredCitiesList} 
                          setSearchQuery={setSearchQuery} setSelectedMonth={setSelectedMonth} 
                          onHideCity={handleHideCity}
                          favoriteCityIds={favoriteCityIds} onToggleFavorite={handleToggleFavorite}
                          onOpenAiGuide={setAiGuideCity}
                        />
                      </motion.div>
                    )}

                    {viewMode === 'month' && (
                      <motion.div key="month" variants={pageVariants} initial="initial" animate="animate" exit="exit">
                        <MonthCalendarView 
                          calendarYear={calendarYear} calendarMonth={calendarMonth} 
                          handlePrevMonth={handlePrevMonth} handleNextMonth={handleNextMonth} 
                          setViewMode={setViewMode} jumpToToday={jumpToToday} 
                          monthData={yearGrid[calendarMonth]} todayDateOnly={todayDateOnly} 
                          favoriteCityIds={favoriteCityIds} setSelectedDayInfo={setSelectedDayInfo}
                        />
                      </motion.div>
                    )}
                    
                    {viewMode === 'year' && (
                      <motion.div key="year" variants={pageVariants} initial="initial" animate="animate" exit="exit">
                        <YearCalendarView 
                          calendarYear={calendarYear} handlePrevYear={handlePrevYear} 
                          handleNextYear={handleNextYear} setCalendarMonth={setCalendarMonth} 
                          setViewMode={setViewMode} jumpToToday={jumpToToday} 
                          todayDateOnly={todayDateOnly} yearGrid={yearGrid}
                          favoriteCityIds={favoriteCityIds} setSelectedDayInfo={setSelectedDayInfo}
                        />
                      </motion.div>
                    )}
                    
                    {viewMode === 'list' && (
                      <motion.div key="list" variants={pageVariants} initial="initial" animate="animate" exit="exit">
                        <CityListView 
                          groupedCities={groupedAndFilteredCitiesList} 
                          setSearchQuery={setSearchQuery} setSelectedMonth={setSelectedMonth} 
                          onHideCity={handleHideCity}
                          favoriteCityIds={favoriteCityIds} onToggleFavorite={handleToggleFavorite}
                          onOpenAiGuide={setAiGuideCity}
                          sortMode={sortMode}
                        />
                      </motion.div>
                    )}
                  </AnimatePresence>
                </main>

                {/* Модальне вікно для деталей подій (Рік та Місяць) */}
                <AnimatePresence>
                  {selectedDayInfo && (
                    <motion.div 
                      initial={{ opacity: 0 }}
                      animate={{ opacity: 1 }}
                      exit={{ opacity: 0 }}
                      className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 dark:bg-slate-900/70 backdrop-blur-sm"
                      onClick={() => setSelectedDayInfo(null)}
                      role="dialog"
                      aria-modal="true"
                    >
                      <motion.div 
                        initial={{ scale: 0.9, opacity: 0 }}
                        animate={{ scale: 1, opacity: 1 }}
                        exit={{ scale: 0.9, opacity: 0 }}
                        transition={{ type: "spring", damping: 25, stiffness: 300 }}
                        className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-xl max-w-sm w-full border border-slate-100 dark:border-slate-700 max-h-[80vh] overflow-y-auto"
                        onClick={e => e.stopPropagation()}
                      >
                        <div className="flex items-center justify-between mb-4">
                          <h3 className="text-xl font-bold text-slate-900 dark:text-white capitalize">
                            {selectedDayInfo.day} {selectedDayInfo.monthName}
                          </h3>
                          <div className="bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400 p-1.5 rounded-lg flex-shrink-0">
                            <CalendarDays size={20} aria-hidden="true" />
                          </div>
                        </div>
                        <div className="space-y-3">
                          {selectedDayInfo.cities.map((cityObj, idx) => {
                            const isFav = favoriteCityIds.includes(cityObj.id);
                            return (
                              <div key={idx} className={`flex flex-col gap-2 p-3 rounded-xl border ${isFav ? 'bg-yellow-50 dark:bg-yellow-900/20 border-[#ffd700]/50 shadow-sm' : 'bg-slate-50 dark:bg-slate-700/50 border-slate-100 dark:border-slate-700/50'}`}>
                                <div className="flex items-center gap-3 text-slate-800 dark:text-slate-200">
                                  {isFav ? <Star size={18} fill="currentColor" className="text-[#ffd700]" /> : <CityIcon size={18} className="text-[#0057b7] dark:text-[#4da3ff]" />}
                                  <span className="font-semibold text-lg">{cityObj.name}</span>
                                </div>
                                <div className="flex items-center justify-between mt-1">
                                  <span className="text-xs text-slate-500 dark:text-slate-400">{cityObj.region}</span>
                                  <button
                                    onClick={() => setAiGuideCity(cityObj)}
                                    className="px-2 py-1 rounded text-[10px] font-bold bg-gradient-to-r from-purple-100 to-pink-100 text-purple-700 hover:from-purple-200 hover:to-pink-200 dark:from-purple-900/40 dark:to-pink-900/40 dark:text-purple-300 dark:hover:from-purple-800/60 transition-colors flex items-center gap-1 shadow-sm border border-purple-200/50 dark:border-purple-800/50"
                                  >
                                    ✨ ШІ-Гід
                                  </button>
                                </div>
                              </div>
                            )
                          })}
                        </div>
                        <button 
                          ref={closeDayInfoRef}
                          onClick={() => setSelectedDayInfo(null)}
                          className="mt-6 w-full py-2.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-xl font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0057b7]"
                        >
                          Закрити
                        </button>
                      </motion.div>
                    </motion.div>
                  )}
                </AnimatePresence>

                {/* Модалка Налаштувань */}
                {isSettingsOpen && <SettingsModal apiKey={userApiKey} setApiKey={setUserApiKey} onClose={() => setIsSettingsOpen(false)} />}

                {/* Модалка ШІ-Гіда (Gemini) */}
                <AiGuideModal city={aiGuideCity} onClose={() => setAiGuideCity(null)} apiKey={userApiKey} onOpenSettings={() => setIsSettingsOpen(true)} />

              </div>
            </div>
          );
        }

        // Запуск React застосунку в HTML
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(console.error);
          });
        }
    </script>
</body>
</html>
