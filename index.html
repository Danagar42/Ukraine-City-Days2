          { id: 26, name: 'Чернівці', month: 10, region: 'Чернівецька область', rule: { type: 'nth', n: 1, day: DAYS.SATURDAY }, coatOfArms: 'https://upload.wikimedia.org/wikipedia/commons/0/03/Coat_of_Arms_of_Chernivtsi.svg' },
          { id: 27, name: 'Ужгород', month: 10, region: 'Закарпатська область', rule: { type: 'nth', n: 1, day: DAYS.SUNDAY }, coatOfArms: 'https://upload.wikimedia.org/wikipedia/commons/d/d7/Coat_of_arms_of_Uzhhorod.svg' },
          { id: 28, name: 'Запоріжжя', month: 10, region: 'Запорізька область', rule: { type: 'first-weekend' }, coatOfArms: 'https://upload.wikimedia.org/wikipedia/commons/0/07/Coat_of_Arms_of_Zaporizhzhia.svg' },
        ];

        const filterMonths = [
          { id: 0, name: 'Всі місяці' },
          { id: 5, name: 'Травень' }, { id: 6, name: 'Червень' },
          { id: 8, name: 'Серпень' }, { id: 9, name: 'Вересень' },
          { id: 10, name: 'Жовтень' }
        ];

        // ==========================================
        // ІНТЕГРАЦІЯ З GEMINI API
        // ==========================================
        const generateWithGemini = async (prompt, userApiKey = "") => {
            const apiKey = ""; // Інжектиться середовищем (працює тут)
            const activeKey = userApiKey || apiKey; // Використовуємо ключ користувача, якщо є
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${activeKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { 
                  parts: [{ 
                    text: "Ти - привітний та обізнаний український гід-експерт." 
                  }] 
                },
                // Примусово просимо ШІ повертати валідний JSON
                generationConfig: { responseMimeType: "application/json" }
            };

            const delays = [1000, 2000, 4000, 8000, 16000];
            
            for (let i = 0; i <= delays.length; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                      const errData = await response.json().catch(() => ({}));
                      throw new Error(errData.error?.message || `HTTP error! status: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    const textContent = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (textContent) {
                        return JSON.parse(textContent);
                    }
                    throw new Error("Порожня відповідь");
                } catch (error) {
                    if (i === delays.length) {
                        console.error("Gemini API Error after retries:", error);
                        return null;
                    }
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        const fetchWikiImage = async (searchQuery) => {
            try {
                // Прямий пошук по назві статті у Вікіпедії
                const response = await fetch(`https://uk.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=800&titles=${encodeURIComponent(searchQuery)}&origin=*`);
                const data = await response.json();
                const pages = data.query?.pages;
                if (!pages) return null;
                const pageId = Object.keys(pages)[0];
                
                if (pageId !== "-1" && pages[pageId].thumbnail) {
                    return pages[pageId].thumbnail.source;
                }
                
                // Fallback: якщо прямої статті немає, шукаємо і беремо перше співпадіння
                const searchRes = await fetch(`https://uk.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(searchQuery)}&utf8=&format=json&origin=*`);
                const searchData = await searchRes.json();
                if (searchData.query?.search?.length > 0) {
                     const firstTitle = searchData.query.search[0].title;
                     const imgRes = await fetch(`https://uk.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=800&titles=${encodeURIComponent(firstTitle)}&origin=*`);
                     const imgData = await imgRes.json();
                     const imgPages = imgData.query?.pages;
                     const imgPageId = Object.keys(imgPages)[0];
                     if (imgPageId !== "-1" && imgPages[imgPageId].thumbnail) {
                         return imgPages[imgPageId].thumbnail.source;
                     }
                }
                return null;
            } catch (e) {
                return null;
            }
        };

        // ==========================================
        // АНІМАЦІЇ (Framer Motion)
        // ==========================================
        const pageVariants = {
            initial: { opacity: 0, y: 15, scale: 0.98 },
            animate: { opacity: 1, y: 0, scale: 1, transition: { duration: 0.3, ease: "easeOut" } },
            exit: { opacity: 0, y: -15, scale: 0.98, transition: { duration: 0.2, ease: "easeIn" } }
        };

        // ==========================================
        // ГЛОБАЛЬНІ СТИЛІ
        // ==========================================
        const GlobalStyles = memo(() => (
          <style dangerouslySetInnerHTML={{__html: `
            .hide-scrollbar::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
            
            /* Markdown стилі для модалки ШІ-Гіда */

            .dark .prose-ai h3 { color: #4da3ff; }
            .prose-ai p { margin-bottom: 0.75rem; line-height: 1.5; }
            .prose-ai ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
            .prose-ai ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
            .prose-ai li { margin-bottom: 0.25rem; }

            .dark .prose-ai strong { color: #f8fafc; }
          `}} />
        ));

        // ==========================================
        // УНІВЕРСАЛЬНИЙ ШАР ОБРОБКИ ДАТ
        // ==========================================

        const generateDateText = (rule, monthZeroIndexed) => {
          const m = MONTHS_GENITIVE[monthZeroIndexed];
          switch (rule.type) {
            case 'exact': return `${rule.day} ${m}`;
            case 'nth': return `${NTH_NAMES_FEMININE[rule.n]} ${DAYS_NAMES[rule.day]} ${m}`;
            case 'last': return `Остання ${DAYS_NAMES[rule.day]} ${m}`;
            case 'first-weekend': return `Перші вихідні ${m}`;
            case 'last-weekend': return `Останні вихідні ${m}`;
            default: return '';
          }
        };

        const getCityOccurrenceDates = (year, monthZeroIndexed, rule) => {
          const dates = [];
          const daysInMonth = new Date(year, monthZeroIndexed + 1, 0).getDate();

          if (rule.type === 'exact') {
            if (rule.day <= daysInMonth) dates.push(rule.day);
          } else if (rule.type === 'nth') {
            let d = new Date(year, monthZeroIndexed, 1);
            let count = 0;
            while (d.getMonth() === monthZeroIndexed) {
              if (d.getDay() === rule.day) {
                count++;
                if (count === rule.n) { dates.push(d.getDate()); break; }
              }
              d.setDate(d.getDate() + 1);
            }
          } else if (rule.type === 'last') {
            let d = new Date(year, monthZeroIndexed + 1, 0);
            while (d.getMonth() === monthZeroIndexed) {
              if (d.getDay() === rule.day) { dates.push(d.getDate()); break; }
              d.setDate(d.getDate() - 1);
            }
          } else if (rule.type === 'first-weekend') {
            let d = new Date(year, monthZeroIndexed, 1);
            while (d.getMonth() === monthZeroIndexed) {
              if (d.getDay() === DAYS.SATURDAY) {
                const saturday = d.getDate();
                dates.push(saturday);
                if (saturday + 1 <= daysInMonth) dates.push(saturday + 1);
                break;
              }
              d.setDate(d.getDate() + 1);
            }
          } else if (rule.type === 'last-weekend') {
            let d = new Date(year, monthZeroIndexed + 1, 0);
            while (d.getMonth() === monthZeroIndexed) {
              if (d.getDay() === DAYS.SUNDAY) {
                const sunday = d.getDate();
                if (sunday - 1 >= 1) dates.push(sunday - 1);
                dates.push(sunday);
                break;
              }
              d.setDate(d.getDate() - 1);
            }
            dates.sort((a, b) => a - b);
          }
          return dates;
        };

        const getPluralDays = (days) => {
          const d = Math.abs(days);
          if (d % 10 === 1 && d % 100 !== 11) return 'день';
          if ([2, 3, 4].includes(d % 10) && ![12, 13, 14].includes(d % 100)) return 'дні';
          return 'днів';
        };

        const getGoogleCalendarLink = (city) => {
          if (!city.targetDate || !city.displayDates) return '#';
          const formatDate = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}${m}${d}`;
          };
          
          const start = formatDate(city.targetDate);
          const lastDay = city.displayDates[city.displayDates.length - 1];
          const endDate = new Date(city.targetDate.getFullYear(), city.targetDate.getMonth(), lastDay);
          endDate.setDate(endDate.getDate() + 1);
          const end = formatDate(endDate);

          const text = encodeURIComponent(`День міста: ${city.name}`);
          const details = encodeURIComponent(`Святкування Дня міста ${city.name}.`);
          const location = encodeURIComponent(`${city.name}, ${city.region}, Україна`);

          return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${start}/${end}&details=${details}&location=${location}`;
        };

        // ==========================================
        // КАСТОМНІ ХУКИ
        // ==========================================
        function useLocalStorage(key, initialValue) {
          const [storedValue, setStoredValue] = useState(() => {
            try {
              const item = window.localStorage.getItem(key);
              return item ? JSON.parse(item) : initialValue;
            } catch (error) { return initialValue; }
          });

          const setValue = useCallback((value) => {
            setStoredValue((prevValue) => {
              try {
                const valueToStore = value instanceof Function ? value(prevValue) : value;
                window.localStorage.setItem(key, JSON.stringify(valueToStore));
                return valueToStore;
              } catch (error) { return prevValue; }
            });
          }, [key]);

          useEffect(() => {
            const handleStorageChange = (e) => {
              if (e.key === key && e.newValue !== null) {
                setStoredValue(JSON.parse(e.newValue));
              }
            };
            window.addEventListener('storage', handleStorageChange);
            return () => window.removeEventListener('storage', handleStorageChange);
          }, [key]);

          return [storedValue, setValue];
        }

        function useDebounce(value, delay) {
          const [debouncedValue, setDebouncedValue] = useState(value);
          useEffect(() => {
            const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
            return () => clearTimeout(handler);
          }, [value, delay]);
          return debouncedValue;
        }

        function useCalendarData(cities, currentYear, todayDateOnly) {
          return useMemo(() => {
            const yearGrid = Array.from({ length: 12 }, () => ({}));
            const upcomingListRaw = [];

            try {
              cities.forEach(city => {
                if (!city || typeof city.month !== 'number' || city.month < 1 || city.month > 12 || !city.rule) {
                  return;
                }

                const mIdx = city.month - 1;
                const dateText = generateDateText(city.rule, mIdx);
                const enrichedCity = { ...city, dateText };

                const currentYearDates = getCityOccurrenceDates(currentYear, mIdx, city.rule);
                currentYearDates.forEach(d => {
                  if (!yearGrid[mIdx][d]) yearGrid[mIdx][d] = [];
                  yearGrid[mIdx][d].push(enrichedCity);
                });

                const todayYear = todayDateOnly.getFullYear();
                let exactDays = getCityOccurrenceDates(todayYear, mIdx, city.rule);
                
                if (exactDays.length > 0) {
                  let primaryDay = exactDays[0];
                  let lastDay = exactDays[exactDays.length - 1];
                  let targetDate = new Date(todayYear, mIdx, primaryDay);
                  let lastTargetDate = new Date(todayYear, mIdx, lastDay);

                  if (lastTargetDate < todayDateOnly) {
                    exactDays = getCityOccurrenceDates(todayYear + 1, mIdx, city.rule);
                    primaryDay = exactDays[0];
                    targetDate = new Date(todayYear + 1, mIdx, primaryDay);
                  }

                  const diffTime = targetDate - todayDateOnly;
                  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                  upcomingListRaw.push({ ...enrichedCity, targetDate, diffDays, displayDates: exactDays });
                }
              });

              upcomingListRaw.sort((a, b) => a.diffDays - b.diffDays);
              const groupsMap = new Map();
              upcomingListRaw.forEach(city => {
                const key = `${city.targetDate.getMonth()}-${city.targetDate.getFullYear()}`;
                if (!groupsMap.has(key)) {
                  groupsMap.set(key, { 
                    title: `${city.targetDate.toLocaleString('uk-UA', { month: 'long' })} ${city.targetDate.getFullYear()}`, 
                    cities: [] 
                  });
                }
                groupsMap.get(key).cities.push(city);
              });

              return {
                yearGrid,
                upcomingGroups: Array.from(groupsMap.values())
              };
            } catch (error) {
              console.error("Помилка обробки дат:", error);
              return { yearGrid, upcomingGroups: [] };
            }
          }, [cities, currentYear, todayDateOnly]);
        }

        // ==========================================
        // КОМПОНЕНТИ ВІДОБРАЖЕННЯ
        // ==========================================

        const Header = memo(({ searchQuery, debouncedQuery, setSearchQuery, viewMode, setViewMode, selectedMonth, setSelectedMonth, isDarkMode, setIsDarkMode, hiddenCityIds, setHiddenCityIds, showFavoritesOnly, setShowFavoritesOnly, onOpenSettings, sortMode, setSortMode }) => {
          const hasActiveFilters = debouncedQuery.trim() !== '' || ((viewMode === 'list' || viewMode === 'timeline') && selectedMonth !== 0) || hiddenCityIds.length > 0;

          return (
            <header className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/50 dark:border-slate-800/50 sticky top-0 z-30 shadow-sm transition-colors duration-300">
              <div className="max-w-5xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col gap-4">
                
                {/* ВЕРХНІЙ РЯДОК: Логотип та Налаштування */}
                <div className="flex items-center justify-between w-full">
                  <div className="flex items-center gap-3">
                    <div className="bg-gradient-to-br from-[#0057b7] to-blue-500 p-2 rounded-xl shadow-md text-white flex-shrink-0">
                      <CalendarDays size={28} />
                    </div>
                    <div>
                      <h1 className="text-2xl font-bold text-slate-900 dark:text-white leading-tight transition-colors duration-300">
                        Дні міст <span className="text-[#0057b7] dark:text-[#4da3ff]">України</span>
                        <span className="inline-block w-3 h-3 rounded-full bg-[#ffd700] ml-1 mb-1 shadow-sm"></span>
                      </h1>
                      <p className="text-sm text-slate-500 dark:text-slate-400 font-medium transition-colors duration-300">Інтерактивний календар</p>

                  </div>
                  
                  {/* Іконки налаштувань (завжди згруповані справа) */}

                    <button

                      <Settings size={20} />
                    </button>
                    <button 
                      onClick={() => setIsDarkMode(!isDarkMode)}

                      className="p-2 sm:p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors"
                      title={isDarkMode ? "Світла тема" : "Темна тема"}
                    >
                      {isDarkMode ? <Sun size={20} /> : <Moon size={20} />}
                    </button>
                  </div>
                </div>

                {/* НИЖНІЙ РЯДОК: Пошук та Фільтри */}
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 w-full">
                  <div className="relative w-full md:w-64 lg:w-72 flex-shrink-0">
                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                      <Search className="h-5 w-5 text-slate-400 dark:text-slate-500" />
                    </div>
                    <input
                      type="text"
                      className="block w-full pl-10 pr-3 py-2.5 border border-slate-200/80 dark:border-slate-700/50 rounded-xl leading-5 bg-slate-50/50 dark:bg-slate-800/50 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-[#0057b7] dark:focus:ring-[#4da3ff] focus:border-transparent sm:text-sm transition-all duration-200 shadow-inner"
                      placeholder="Знайти місто чи область..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>
                  
                  {/* Кнопки перемикання режимів та фільтрів */}
                  <div className="flex bg-slate-100/80 dark:bg-slate-800/50 backdrop-blur-sm p-1.5 rounded-xl flex-shrink-0 w-full md:w-auto overflow-x-auto hide-scrollbar transition-colors duration-300 gap-1 border border-white/20 dark:border-slate-700/30" role="group" aria-label="Вибір режиму перегляду">
                    <button 
                      onClick={() => setViewMode('year')} 
                      aria-pressed={viewMode === 'year'}
                      className={`p-2 px-3 sm:px-4 rounded-lg flex items-center justify-center flex-1 md:flex-none transition-all duration-300 ${viewMode === 'year' ? 'bg-white dark:bg-slate-700 shadow-sm text-[#0057b7] dark:text-[#4da3ff]' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                      title="Рік"
                    >
                      <Grid3X3 size={18} className="mr-0 xl:mr-1.5" />
                      <span className="hidden xl:inline font-medium text-sm">Рік</span>
                    </button>
                    <button 
                      onClick={() => setViewMode('month')} 
                      aria-pressed={viewMode === 'month'}
                      className={`p-2 px-3 sm:px-4 rounded-lg flex items-center justify-center flex-1 md:flex-none transition-all duration-300 ${viewMode === 'month' ? 'bg-white dark:bg-slate-700 shadow-sm text-[#0057b7] dark:text-[#4da3ff]' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                      title="Місяць"
                    >
                      <CalendarDays size={18} className="mr-0 xl:mr-1.5" />
                      <span className="hidden xl:inline font-medium text-sm">Місяць</span>
                    </button>
                    <button 
                      onClick={() => setViewMode('timeline')} 
                      aria-pressed={viewMode === 'timeline'}
                      className={`p-2 px-3 sm:px-4 rounded-lg flex items-center justify-center flex-1 md:flex-none transition-all duration-300 ${viewMode === 'timeline' ? 'bg-white dark:bg-slate-700 shadow-sm text-[#0057b7] dark:text-[#4da3ff]' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                      title="Таймлайн"
                    >
                      <History size={18} className="mr-0 xl:mr-1.5" />
                      <span className="hidden xl:inline font-medium text-sm">Таймлайн</span>
                    </button>
                    <button 
                      onClick={() => setViewMode('list')} 
                      aria-pressed={viewMode === 'list'}
                      className={`p-2 px-3 sm:px-4 rounded-lg flex items-center justify-center flex-1 md:flex-none transition-all duration-300 ${viewMode === 'list' ? 'bg-white dark:bg-slate-700 shadow-sm text-[#0057b7] dark:text-[#4da3ff]' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'}`}
                      title="Списком"
                    >
                      <LayoutList size={18} className="mr-0 xl:mr-1.5" />
                      <span className="hidden xl:inline font-medium text-sm">Список</span>
                    </button>
                    
                    <div className="w-px bg-slate-300 dark:bg-slate-600 my-1 mx-0.5"></div>
                    
                    {viewMode === 'list' && (
                      <button 
                        onClick={() => setSortMode(prev => prev === 'date' ? 'alpha' : 'date')}
                        className="p-2 px-3 sm:px-4 rounded-lg flex items-center justify-center flex-1 md:flex-none transition-all duration-300 text-[#0057b7] dark:text-[#4da3ff] hover:bg-slate-200/50 dark:hover:bg-slate-700"
                        title={sortMode === 'date' ? "Сортувати за алфавітом" : "Сортувати за датою"}
                      >
                        {sortMode === 'date' ? <ArrowDownAZ size={18} className="mr-0 xl:mr-1.5" /> : <Calendar size={18} className="mr-0 xl:mr-1.5" />}
                        <span className="hidden xl:inline font-medium text-sm">{sortMode === 'date' ? 'За абеткою' : 'За датою'}</span>
                      </button>
                    )}

                    <button 
                      onClick={() => setShowFavoritesOnly(!showFavoritesOnly)} 
                      aria-pressed={showFavoritesOnly}
                      className={`p-2 px-3 sm:px-4 rounded-lg flex items-center justify-center flex-1 md:flex-none transition-all duration-300 ${showFavoritesOnly ? 'bg-yellow-50 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 shadow-sm ring-1 ring-yellow-400/50' : 'text-slate-400 hover:text-yellow-500 dark:hover:text-yellow-400'}`}
                      title="Тільки обрані"
                    >
                      <Star size={18} fill={showFavoritesOnly ? "currentColor" : "none"} className="mr-0 xl:mr-1.5" />
                      <span className="hidden xl:inline font-medium text-sm">Обрані</span>
                    </button>
                  </div>
                </div>

                {/* Анімація для активних фільтрів */}
                <AnimatePresence>
                  {hasActiveFilters && (
                    <motion.div 
                      initial={{ opacity: 0, height: 0 }}
                      animate={{ opacity: 1, height: 'auto' }}
                      exit={{ opacity: 0, height: 0 }}
                      className="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800/80 flex flex-wrap gap-2.5 items-center overflow-hidden"
                    >
                      <span className="text-slate-400 dark:text-slate-500 text-[10px] font-bold uppercase tracking-wider">Активні фільтри:</span>
                      
                      {debouncedQuery.trim() !== '' && (
                        <span className="flex items-center gap-1.5 bg-blue-50 dark:bg-slate-800 text-[#0057b7] dark:text-[#4da3ff] px-2.5 py-1 rounded-lg shadow-sm border border-blue-100 dark:border-slate-700 text-xs font-medium">
                          Пошук: <strong className="max-w-[120px] sm:max-w-[180px] truncate">{debouncedQuery}</strong>
                          <button onClick={() => setSearchQuery('')} className="ml-1 p-0.5 rounded-md text-slate-400 hover:text-red-500 hover:bg-white dark:hover:bg-slate-700 transition-colors" aria-label="Очистити пошук"><X size={14}/></button>
                        </span>
                      )}

                      {((viewMode === 'list' || viewMode === 'timeline') && selectedMonth !== 0) && (
                        <span className="flex items-center gap-1.5 bg-blue-50 dark:bg-slate-800 text-[#0057b7] dark:text-[#4da3ff] px-2.5 py-1 rounded-lg shadow-sm border border-blue-100 dark:border-slate-700 text-xs font-medium">
                          Місяць: <strong className="text-slate-800 dark:text-white">{filterMonths.find(m => m.id === selectedMonth)?.name}</strong>
                          <button onClick={() => setSelectedMonth(0)} className="ml-1 p-0.5 rounded-md text-slate-400 hover:text-red-500 hover:bg-white dark:hover:bg-slate-700 transition-colors" aria-label="Очистити місяць"><X size={14}/></button>
                        </span>
                      )}

                      {hiddenCityIds.length > 0 && (
                        <span className="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700 text-xs font-medium">
                          Приховано міст: <strong className="text-slate-800 dark:text-white">{hiddenCityIds.length}</strong>
                          <button onClick={() => setHiddenCityIds([])} title="Показати всі приховані міста" className="ml-1 p-0.5 rounded-md text-slate-400 hover:text-red-500 hover:bg-white dark:hover:bg-slate-700 transition-colors" aria-label="Скинути приховані"><X size={14}/></button>
                        </span>
                      )}
                    </motion.div>
                  )}
                </AnimatePresence>

                {/* Фільтри по місяцях (відображаємо і для списку, і для таймлайну) */}
                <AnimatePresence>
                  {(viewMode === 'list' || viewMode === 'timeline') && (
                    <motion.div 
                      initial={{ opacity: 0, y: -10 }}
                      animate={{ opacity: 1, y: 0 }}
                      exit={{ opacity: 0, y: -10 }}
                      className="mt-5 flex overflow-x-auto pb-2 hide-scrollbar gap-2"
                    >
                      {filterMonths.map(month => (
                        <button
                          key={month.id}
                          onClick={() => setSelectedMonth(month.id)}
                          aria-pressed={selectedMonth === month.id}
                          className={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 ${
                            selectedMonth === month.id
                              ? 'bg-[#0057b7] text-white shadow-md border-transparent'
                              : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50'
                          }`}
                        >
                          {month.name}
                        </button>
                      ))}
                    </motion.div>
                  )}
                </AnimatePresence>
              </div>
            </header>
          );
        });

        // Модалка налаштувань (для API ключа)
        const SettingsModal = ({ apiKey, setApiKey, onClose }) => {
          const [tempKey, setTempKey] = useState(apiKey);
          const [saved, setSaved] = useState(false);

          const handleSave = () => {
            setApiKey(tempKey.trim());
            setSaved(true);
            setTimeout(() => { setSaved(false); onClose(); }, 1500);
          };

          return (
            <AnimatePresence>
              <motion.div 
                initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm"
                onClick={onClose}
              >
                <motion.div 
                  initial={{ scale: 0.95, opacity: 0, y: 20 }} animate={{ scale: 1, opacity: 1, y: 0 }} exit={{ scale: 0.95, opacity: 0, y: 20 }}
                  className="bg-white dark:bg-slate-800 rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100 dark:border-slate-700 relative"
                  onClick={e => e.stopPropagation()}
                >
                  <button onClick={onClose} className="absolute top-4 right-4 p-1.5 text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors"><X size={20} /></button>
                  
                  <div className="flex items-center gap-3 mb-6">
                    <div className="bg-slate-100 dark:bg-slate-700 p-2.5 rounded-xl text-slate-600 dark:text-slate-300"><Settings size={24} /></div>
                    <h2 className="text-xl font-bold text-slate-900 dark:text-white">Налаштування</h2>
                  </div>

                  <div className="mb-6">
                    <label className="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2 flex items-center gap-2">
                      <KeyRound size={16} className="text-purple-500" />
                      Gemini API Ключ
                    </label>
                    <input 
                      type="password"
                      value={tempKey}
                      onChange={e => setTempKey(e.target.value)}
                      placeholder="AIzaSy..."
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-500 transition-shadow"
                    />
                    <p className="mt-3 text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                      Щоб використовувати ШІ-Гіда локально або на власному сайті, вам потрібен власний безкоштовний ключ. Отримати його можна в <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" className="text-blue-500 hover:underline">Google AI Studio</a>. Ключ зберігається лише у вашому браузері.
                    </p>
                  </div>

                  <div className="flex gap-3">
                    <button onClick={onClose} className="flex-1 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl font-semibold hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Скасувати</button>
                    <button onClick={handleSave} className="flex-1 py-2.5 bg-purple-600 text-white rounded-xl font-semibold hover:bg-purple-700 transition-colors flex justify-center items-center">
                      {saved ? 'Збережено!' : 'Зберегти'}
                    </button>
                  </div>
                </motion.div>
              </motion.div>
            </AnimatePresence>
          );
        };

        // Модалка для ШІ-Гіда
        const AiGuideModal = ({ city, onClose, apiKey, onOpenSettings }) => {
          const [guideData, setGuideData] = useState(null);
          const [cityImage, setCityImage] = useState(null);
          const [placeImages, setPlaceImages] = useState({});
          const [isLoading, setIsLoading] = useState(true);
          const [error, setError] = useState(false);

          useEffect(() => {
            if (!city) return;
            setIsLoading(true);
            setError(false);
            setGuideData(null);
            setCityImage(null);
            setPlaceImages({});

            const cacheKey = 'ai_guide_' + city.id;
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
              try {
                const parsed = JSON.parse(cached);
                setGuideData(parsed.data);
                if (parsed.cityImage) setCityImage(parsed.cityImage);
                if (parsed.placeImages) setPlaceImages(parsed.placeImages);
                setIsLoading(false);
                return;
              } catch (e) { console.error('Cache parse error', e); }
            }

            const prompt = `Розкажи 3 маловідомі, але дуже цікаві факти про місто ${city.name} (Україна). Також склади короткий путівник з 3-4 цікавими місцями, які обов'язково варто відвідати.
Формат відповіді СУВОРО JSON:
{
  "facts": ["факт 1", "факт 2", "факт 3"],
  "places": [
    {
      "name": "Коротка назва місця",
      "description": "Опис місця (2-3 речення)",
      "wikipedia_query": "Точна назва українською для пошуку статті у Вікіпедії (наприклад 'Площа Ринок', 'Хотинська фортеця')"
    }
  ],
  "conclusion": "Короткий надихаючий підсумок"
}`;
            
            generateWithGemini(prompt, apiKey).then(async (data) => {
              if (!data) {
                  setError(true);
                  setIsLoading(false);
                  return;
              }
              setGuideData(data);
              
              let finalCityImage = null;
              let finalPlaceImages = {};

              // Завантажуємо реальне фото міста з Вікіпедії
              finalCityImage = await fetchWikiImage(city.name);
              if (finalCityImage) setCityImage(finalCityImage);

              // Завантажуємо реальні фото локацій
              if (data.places && Array.isArray(data.places)) {
                  await Promise.all(data.places.map(async (place) => {
                      const url = await fetchWikiImage(place.wikipedia_query || place.name);
                      if (url) {
                          finalPlaceImages[place.name] = url;
                          setPlaceImages(prev => ({ ...prev, [place.name]: url }));
                      }
                  }));
              }
              
              // Зберігаємо в кеш
              localStorage.setItem(cacheKey, JSON.stringify({
                data: data,
                cityImage: finalCityImage,
                placeImages: finalPlaceImages
              }));

              setIsLoading(false);
            });
          }, [city, apiKey]);

          if (!city) return null;

          const SkeletonText = ({ width }) => <div className={`h-4 bg-slate-200 dark:bg-slate-700 rounded w-${width} mb-2`}></div>;
          const SkeletonCard = () => (
            <div className="bg-white dark:bg-slate-800 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col">
              <div className="h-44 bg-slate-200 dark:bg-slate-700 animate-pulse"></div>
              <div className="p-4 flex-1 flex flex-col animate-pulse">
                <div className="h-5 bg-slate-200 dark:bg-slate-700 rounded w-3/4 mb-3"></div>
                <SkeletonText width="full" />
                <SkeletonText width="5/6" />
                <SkeletonText width="4/6" />
              </div>
            </div>
          );

          return (
            <AnimatePresence>
              <motion.div 
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                className="fixed inset-0 z-[60] flex items-center justify-center p-0 sm:p-6 bg-slate-900/60 dark:bg-slate-900/90 backdrop-blur-sm"
                onClick={onClose}
              >
                <motion.div 
                  initial={{ scale: 0.95, opacity: 0, y: 20 }}
                  animate={{ scale: 1, opacity: 1, y: 0 }}
                  exit={{ scale: 0.95, opacity: 0, y: 20 }}
                  transition={{ type: "spring", damping: 25, stiffness: 300 }}
                  className="bg-white dark:bg-slate-800 sm:rounded-2xl shadow-2xl max-w-3xl w-full h-full sm:h-auto sm:max-h-[90vh] flex flex-col overflow-hidden relative"
                  onClick={e => e.stopPropagation()}
                >
                  {/* Декоративний градієнт зверху */}
                  <div className="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-400 z-30"></div>
                  
                  {/* Липка шапка-контролер */}
                  <div className="flex items-center justify-between p-3 sm:p-4 border-b border-slate-100 dark:border-slate-700 z-20 bg-white/95 dark:bg-slate-800/95 backdrop-blur absolute top-1.5 left-0 right-0">
                    <div className="flex items-center gap-2">
                      <div className="text-purple-600 dark:text-purple-400">
                        <Sparkles size={20} />
                      </div>
                      <h2 className="font-bold text-slate-900 dark:text-white">ШІ-Гід: {city.name}</h2>
                    </div>
                    <button 
                      onClick={onClose}
                      className="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 dark:hover:text-slate-200 rounded-lg transition-colors"
                    >
                      <X size={24} />
                    </button>
                  </div>

                  <div className="overflow-y-auto hide-scrollbar flex-1 flex flex-col pt-[60px]">
                    
                    {/* Секція зображення міста */}
                    <div className="w-full flex-shrink-0 bg-slate-200 dark:bg-slate-700 min-h-[220px] sm:min-h-[280px] relative shadow-inner">
                      {cityImage ? (
                        <motion.img 
                          initial={{ opacity: 0 }}
                          animate={{ opacity: 1 }}
                          transition={{ duration: 0.6 }}
                          src={cityImage} 
                          alt={city.name} 
                          className="w-full h-full object-cover absolute inset-0"
                        />
                      ) : (
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 opacity-60">
                          <ImageIcon size={32} className="mb-2" />
                          <p className="text-sm font-medium">{isLoading ? "Завантажуємо фото..." : "Фото не знайдено"}</p>
                        </div>
                      )}
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/20 to-transparent pointer-events-none"></div>
                      <div className="absolute bottom-5 left-5 right-5 text-white">
                        <h1 className="text-3xl sm:text-4xl font-extrabold drop-shadow-lg mb-1">{city.name}</h1>
                        <p className="text-slate-200 font-medium drop-shadow flex items-center gap-1.5">
                          <MapPin size={16}/> {city.region}
                        </p>
                      </div>
                    </div>

                    {/* Секція тексту */}
                    <div className="p-5 sm:p-6 pb-10">
                      {isLoading ? (
                        <div className="flex flex-col gap-8 animate-pulse pt-4">
                          <section>
                            <div className="h-7 bg-slate-200 dark:bg-slate-700 rounded w-48 mb-4"></div>
                            <ul className="space-y-3">
                              {[1,2,3].map(i => (
                                <li key={i} className="bg-slate-100 dark:bg-slate-800/80 p-4 rounded-xl border border-slate-200/50 dark:border-slate-700/50 h-20"></li>
                              ))}
                            </ul>
                          </section>
                          <section>
                            <div className="h-7 bg-slate-200 dark:bg-slate-700 rounded w-48 mb-4"></div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              {[1,2,3,4].map(i => <SkeletonCard key={i} />)}
                            </div>
                          </section>
                        </div>
                      ) : error || !guideData ? (
                        <div className="flex flex-col items-center justify-center py-12 text-slate-500 dark:text-slate-400 text-center px-4">
                          <Frown size={40} className="mb-3 opacity-50 text-red-400" />
                          <p className="font-medium text-slate-800 dark:text-slate-200 mb-2">Не вдалося зв'язатися з ШІ.</p>
                          <p className="text-sm mb-5">Можливо, відсутній або вказаний невірний API ключ.</p>
                          <button 
                            onClick={() => { onClose(); onOpenSettings(); }} 
                            className="px-5 py-2 bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300 rounded-xl font-medium hover:bg-purple-200 dark:hover:bg-purple-900/50 transition-colors"
                          >
                            Перевірити налаштування API
                          </button>
                        </div>
                      ) : (
                        <div className="flex flex-col gap-8">
                          {/* Блок Фактів */}
                          <section>
                            <h3 className="text-xl font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2">
                              <Sparkles size={20} className="text-purple-500"/> Цікаві факти
                            </h3>
                            <ul className="space-y-3">
                              {guideData.facts?.map((fact, i) => (
                                <li key={i} className="flex gap-3 text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700/50 leading-relaxed shadow-sm">
                                  <span className="text-purple-500 font-bold shrink-0">{i+1}.</span>
                                  <span>{fact}</span>
                                </li>
                              ))}
                            </ul>
                          </section>

                          {/* Блок Путівника (Картки локацій) */}
                          <section>
                            <h3 className="text-xl font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2">
                              <MapPin size={20} className="text-blue-500"/> Що відвідати
                            </h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                              {guideData.places?.map((place, i) => (
                                <div key={i} className="bg-white dark:bg-slate-800 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col transition-transform hover:-translate-y-1 hover:shadow-md">
                                  <div className="h-44 bg-slate-100 dark:bg-slate-700 relative">
                                    {placeImages[place.name] ? (
                                      <motion.img 
                                        initial={{ opacity: 0 }} animate={{ opacity: 1 }}
                                        src={placeImages[place.name]} alt={place.name} 
                                        className="w-full h-full object-cover" 
                                      />
                                    ) : (
                                      <div className="absolute inset-0 flex items-center justify-center text-slate-400 dark:text-slate-500 opacity-50">
                                        <ImageIcon size={24} />
                                      </div>
                                    )}
                                  </div>
                                  <div className="p-4 flex-1 flex flex-col">
                                    <h4 className="font-bold text-lg text-slate-900 dark:text-white mb-2 leading-tight">{place.name}</h4>
                                    <p className="text-slate-600 dark:text-slate-400 text-sm leading-relaxed flex-1">{place.description}</p>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </section>

                          <div className="bg-blue-50 dark:bg-blue-900/20 p-5 rounded-xl text-blue-800 dark:text-blue-200 italic text-center font-medium shadow-inner border border-blue-100 dark:border-blue-800/30">
                            "{guideData.conclusion}"
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </motion.div>
              </motion.div>
            </AnimatePresence>
          );
        };

        const CityCard = memo(({ city, onHideCity, favoriteCityIds, onToggleFavorite, onOpenAiGuide }) => {
          const [imgError, setImgError] = useState(false);
          const [copied, setCopied] = useState(false);
          const isFavorite = favoriteCityIds.includes(city.id);

          const cardClasses = `group rounded-2xl p-5 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 relative overflow-hidden flex flex-col justify-between h-full bg-white/70 dark:bg-slate-800/70 backdrop-blur-lg ${
            isFavorite 
              ? 'border-2 border-[#ffd700] dark:border-[#ffd700]/80 shadow-[0_4px_15px_rgba(255,215,0,0.15)] dark:shadow-[0_4px_15px_rgba(255,215,0,0.05)]' 
              : 'border border-slate-100/50 dark:border-slate-700/50 shadow-md hover:border-[#ffd700]/70 dark:hover:border-[#ffd700]/50'
          }`;

          const handleShare = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const textToShare = `🎉 День міста ${city.name} (${city.region}) святкується ${city.dateText}! Приєднуйтесь!`;
            if (navigator.clipboard) {
              navigator.clipboard.writeText(textToShare).then(() => {
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
              });
            }
          };

          return (
            <motion.div 
              initial={{ opacity: 0, scale: 0.95 }}
              animate={{ opacity: 1, scale: 1 }}
              transition={{ duration: 0.2 }}
              className={cardClasses}
            >
              <div className="absolute top-0 left-0 w-1.5 h-full bg-[#0057b7] dark:bg-[#4da3ff] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
              
              {/* Плаваючі кнопки зверху праворуч */}
              <div className={`absolute top-2.5 right-2.5 flex items-center gap-0.5 z-10 transition-opacity p-1 rounded-xl bg-white/80 dark:bg-slate-800/80 backdrop-blur-md shadow-sm border border-slate-100 dark:border-slate-700/50 ${isFavorite ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}>
                <button 
                  onClick={(e) => { e.preventDefault(); e.stopPropagation(); onToggleFavorite(city.id); }}
                  className={`p-1.5 rounded-md transition-colors ${isFavorite ? 'text-[#ffd700] hover:text-yellow-500' : 'text-slate-300 hover:text-[#ffd700] dark:text-slate-500 dark:hover:text-[#ffd700]'}`}
                  title={isFavorite ? "Видалити з обраного" : "Додати в обране"}
                  aria-label={isFavorite ? "Видалити з обраного" : "Додати в обране"}
                >
                  <Star size={16} fill={isFavorite ? "currentColor" : "none"} />
                </button>
                <button 
                  onClick={handleShare}
                  className={`p-1.5 rounded-md transition-colors ${copied ? 'text-green-500' : 'text-slate-300 hover:text-blue-500 dark:text-slate-500 dark:hover:text-blue-400'}`}
                  title="Поділитися"
                >
                  <Share2 size={16} />
                </button>
                <button 
                  onClick={(e) => { e.preventDefault(); e.stopPropagation(); onHideCity(city.id); }}
                  className="p-1.5 text-slate-300 hover:text-red-500 hover:bg-red-50 dark:text-slate-500 dark:hover:text-red-400 dark:hover:bg-red-900/20 rounded-md transition-colors"
                  title="Приховати місто"
                  aria-label="Приховати місто"
                >
                  <EyeOff size={16} />
                </button>
              </div>
              
              <div>
                <div className="flex justify-between items-start mb-3 pr-4">
                  <h3 className="text-xl font-bold text-slate-900 dark:text-white group-hover:text-[#0057b7] dark:group-hover:text-[#4da3ff] transition-colors pr-2">
                    {city.name}
                  </h3>
                  <div className={`p-1.5 rounded-lg flex-shrink-0 w-10 h-10 flex items-center justify-center transition-colors duration-300 border ${isFavorite ? 'bg-yellow-50 dark:bg-yellow-900/10 border-yellow-100 dark:border-yellow-800/30' : 'bg-slate-50 dark:bg-slate-700/30 border-slate-100 dark:border-slate-700/50'}`}>
                    {city.coatOfArms && !imgError ? (
                      <img src={city.coatOfArms} alt={`Герб ${city.name}`} className="max-w-full max-h-full object-contain drop-shadow-sm opacity-90 group-hover:opacity-100 transition-opacity" onError={() => setImgError(true)} loading="lazy" />
                    ) : <CityIcon size={18} className={isFavorite ? 'text-yellow-600 dark:text-yellow-500' : 'text-slate-400 dark:text-slate-500'} />}
                  </div>
                </div>
                
                <div className="space-y-2 mt-2">
                  <div className="flex items-center text-slate-500 dark:text-slate-400 text-sm">
                    <MapPin size={16} className="mr-2 text-slate-400 dark:text-slate-500 flex-shrink-0" />
                    <span className="truncate">{city.region}</span>
                  </div>
                  <div className={`flex items-center font-medium p-2 rounded-lg mt-2 transition-colors duration-300 border ${isFavorite ? 'text-[#0057b7] dark:text-[#66b3ff] bg-yellow-50/50 dark:bg-yellow-900/10 border-yellow-200/50 dark:border-yellow-700/30' : 'text-[#0057b7] dark:text-[#66b3ff] bg-blue-50/50 dark:bg-blue-900/20 border-blue-100/50 dark:border-blue-800/30'}`}>
                    <Calendar size={16} className="mr-2 flex-shrink-0" />
                    <span>{city.dateText}</span>
                  </div>
                </div>
              </div>

              <div className="mt-5 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  {city.diffDays === 0 ? (
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 ring-1 ring-green-200 dark:ring-green-800/50 shadow-sm">
                      🎉 Сьогодні!
                    </span>
                  ) : city.diffDays === 1 ? (
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 ring-1 ring-orange-200 dark:ring-orange-800/50 shadow-sm">
                      ⏳ Завтра!
                    </span>
                  ) : city.diffDays < 5 ? (
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-bold bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 ring-1 ring-red-200 dark:ring-red-800/50 shadow-sm animate-pulse">
                      🔥 Залишилось {city.diffDays} {getPluralDays(city.diffDays)}!
                    </span>
                  ) : (
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-300">
                      <Clock size={14} className="text-slate-400 dark:text-slate-400" />
                      через {city.diffDays} {getPluralDays(city.diffDays)}
                    </span>
                  )}
                </div>

                <div className="flex items-center gap-1">
                  <button
                    onClick={(e) => { e.preventDefault(); e.stopPropagation(); onOpenAiGuide(city); }}
                    className="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-gradient-to-r from-purple-100 to-pink-100 text-purple-700 hover:from-purple-200 hover:to-pink-200 dark:from-purple-900/40 dark:to-pink-900/40 dark:text-purple-300 dark:hover:from-purple-800/60 dark:hover:to-pink-800/60 transition-colors flex items-center gap-1 shadow-sm border border-purple-200/50 dark:border-purple-800/50"
                    title="Цікаві факти від ШІ"
                  >
                    ✨ ШІ-Гід
                  </button>
                  <a 
                    href={getGoogleCalendarLink(city)} target="_blank" rel="noopener noreferrer"
                    aria-label={`Додати День міста ${city.name} у Google Календар`}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-[#0057b7] dark:text-slate-500 dark:hover:text-[#4da3ff] hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-all duration-200"
                    title="Додати в Google Calendar"
                  ><CalendarPlus size={20} /></a>
                </div>
              </div>
            </motion.div>
          );
        });

        // ==========================================
        // РЕЖИМ: ТАЙМЛАЙН
        // ==========================================
        const TimelineView = memo(({ groupedCities, setSearchQuery, setSelectedMonth, onHideCity, favoriteCityIds, onToggleFavorite, onOpenAiGuide }) => {
          if (groupedCities.length === 0) {
            return (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="text-center py-20">
                <div className="bg-white dark:bg-slate-800 w-24 h-24 rounded-full flex items-center justify-center mx-auto shadow-sm border border-slate-100 dark:border-slate-700 mb-5 transition-colors">
                  <Frown className="h-12 w-12 text-slate-300 dark:text-slate-600" />
                </div>
                <h3 className="text-xl font-semibold text-slate-900 dark:text-white mb-2">Нічого не знайдено</h3>
                <p className="text-slate-500 dark:text-slate-400">Спробуйте змінити пошуковий запит або скинути фільтри.</p>
                <button onClick={() => { setSearchQuery(''); setSelectedMonth(0); }} className="mt-5 px-4 py-2 bg-slate-100 dark:bg-slate-800 text-[#0057b7] dark:text-[#4da3ff] rounded-xl font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                  Скинути фільтри
                </button>
              </motion.div>
            );
          }

          return (
            <div className="space-y-12 max-w-4xl mx-auto">
              {groupedCities.map((group) => {
                const daysMap = new Map();
                group.cities.forEach(city => {
                  const key = city.targetDate.getTime();
                  if (!daysMap.has(key)) {
                    daysMap.set(key, { 
                      date: city.targetDate, 
                      diffDays: city.diffDays, 
                      cities: [] 
                    });
                  }
                  daysMap.get(key).cities.push(city);
                });
                
                const sortedDays = Array.from(daysMap.values()).sort((a, b) => a.diffDays - b.diffDays);

                return (
                  <section key={group.title} className="relative">
                    <div className="flex items-center gap-4 mb-8 py-2">
                      <div className="bg-gradient-to-br from-[#0057b7] to-blue-500 text-white p-2.5 rounded-full shadow-md flex-shrink-0">
                        <CalendarDays size={20} />
                      </div>
                      <h2 className="text-2xl font-bold text-slate-800 dark:text-white capitalize tracking-tight">
                        {group.title}
                      </h2>
                      <div className="h-px bg-slate-200 dark:bg-slate-700/50 flex-grow mt-1 transition-colors hidden sm:block"></div>
                    </div>

                    <div className="relative border-l-2 border-blue-200 dark:border-blue-800/60 ml-4 sm:ml-7 space-y-10 pb-4">
                      {sortedDays.map((dayGroup, idx) => {
                        const hasFavoriteDay = dayGroup.cities.some(c => favoriteCityIds.includes(c.id));
                        
                        return (
                          <div key={idx} className="relative pl-6 sm:pl-10">
                            {/* Маркер лінії */}
                            <div className={`absolute -left-[9px] top-1.5 w-4 h-4 rounded-full bg-white dark:bg-slate-800 border-4 shadow-md z-10 transition-transform hover:scale-125 duration-300 ${hasFavoriteDay ? 'border-[#ffd700] ring-4 ring-yellow-50 dark:ring-yellow-900/20' : 'border-[#0057b7] dark:border-[#4da3ff] ring-4 ring-slate-50 dark:ring-slate-900'}`}></div>
                            
                            {dayGroup.diffDays <= 7 && dayGroup.diffDays >= 0 && (
                              <div className={`absolute -left-[9px] top-1.5 w-4 h-4 rounded-full animate-ping opacity-75 ${hasFavoriteDay ? 'bg-yellow-400 dark:bg-yellow-500' : 'bg-blue-400 dark:bg-blue-50'}`}></div>
                            )}

                            <div className="mb-4 flex flex-wrap items-center gap-3">
                              <span className={`font-bold text-lg ${hasFavoriteDay ? 'text-yellow-600 dark:text-yellow-500' : 'text-slate-800 dark:text-slate-200'}`}>
                                {dayGroup.date.getDate()} {MONTHS_GENITIVE[dayGroup.date.getMonth()]}
                                {hasFavoriteDay && <Star size={14} className="inline-block ml-1.5 mb-1 opacity-70" fill="currentColor" />}
                              </span>
                              {dayGroup.diffDays === 0 ? (
                                <span className="px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400 border border-green-200 dark:border-green-800">Сьогодні!</span>
                              ) : dayGroup.diffDays === 1 ? (
                                <span className="px-2 py-0.5 rounded text-xs font-bold bg-orange-100 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400 border border-orange-200 dark:border-orange-800">Завтра!</span>
                              ) : (
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400 flex items-center gap-1.5">
                                  <Clock size={14}/> через {dayGroup.diffDays} {getPluralDays(dayGroup.diffDays)}
                                </span>
                              )}
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                              {dayGroup.cities.map(city => (
                                <CityCard key={city.id} city={city} onHideCity={onHideCity} favoriteCityIds={favoriteCityIds} onToggleFavorite={onToggleFavorite} onOpenAiGuide={onOpenAiGuide} />
                              ))}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </section>
                );
              })}
            </div>
          );
        });

        // ==========================================
        // РЕЖИМ: СПИСОК
        // ==========================================
        // ==========================================
        // РЕЖИМ: СПИСОК
        // ==========================================
        const CityListView = memo(({ groupedCities, setSearchQuery, setSelectedMonth, onHideCity, favoriteCityIds, onToggleFavorite, onOpenAiGuide, sortMode }) => {
          if (groupedCities.length === 0) {
            return (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="text-center py-20">
                <div className="bg-white dark:bg-slate-800 w-24 h-24 rounded-full flex items-center justify-center mx-auto shadow-sm border border-slate-100 dark:border-slate-700 mb-5 transition-colors">
                  <Frown className="h-12 w-12 text-slate-300 dark:text-slate-600" />
                </div>
                <h3 className="text-xl font-semibold text-slate-900 dark:text-white mb-2">Нічого не знайдено</h3>
                <p className="text-slate-500 dark:text-slate-400">Спробуйте змінити пошуковий запит або скинути фільтри.</p>
                <button onClick={() => { setSearchQuery(''); setSelectedMonth(0); }} className="mt-5 px-4 py-2 bg-slate-100 dark:bg-slate-800 text-[#0057b7] dark:text-[#4da3ff] rounded-xl font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                  Скинути фільтри
                </button>
              </motion.div>
            );
          }

          if (sortMode === 'alpha') {
            const allCities = groupedCities.flatMap(g => g.cities).sort((a, b) => a.name.localeCompare(b.name));
            return (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {allCities.map((city) => <CityCard key={city.id} city={city} onHideCity={onHideCity} favoriteCityIds={favoriteCityIds} onToggleFavorite={onToggleFavorite} onOpenAiGuide={onOpenAiGuide} />)}
              </div>
            );
          }

          return (
            <div className="space-y-12">
              {groupedCities.map((group) => (
                <section key={group.title}>
                  <div className="flex items-center gap-4 mb-6">
                    <h2 className="text-2xl font-bold text-slate-800 dark:text-white capitalize transition-colors tracking-tight">{group.title}</h2>
                    <div className="h-px bg-slate-200 dark:bg-slate-700/50 flex-grow mt-1 transition-colors"></div>
                    <span className="text-xs font-semibold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-full transition-colors border border-slate-200 dark:border-slate-700">
                      {group.cities.length} {group.cities.length === 1 ? 'місто' : (group.cities.length > 1 && group.cities.length < 5) ? 'міста' : 'міст'}
                    </span>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    {group.cities.map((city) => <CityCard key={city.id} city={city} onHideCity={onHideCity} favoriteCityIds={favoriteCityIds} onToggleFavorite={onToggleFavorite} onOpenAiGuide={onOpenAiGuide} />)}
                  </div>
                </section>
              ))}
            </div>
          );
        });

        // Віджет найближчого свята
        const CountdownWidget = memo(({ nearestCity, onOpenAiGuide }) => {
          if (!nearestCity) return null;
          
          return (
            <motion.div 
              initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }}
              className="mb-8 relative overflow-hidden rounded-2xl bg-gradient-to-r from-blue-600 via-[#0057b7] to-purple-600 text-white shadow-xl"
            >
              <div className="absolute top-0 right-0 p-8 opacity-20 pointer-events-none">
                <CalendarDays size={120} />
              </div>
              <div className="relative z-10 p-6 sm:p-8 flex flex-col sm:flex-row items-center justify-between gap-6">
                <div className="flex-1">
                  <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/20 backdrop-blur-sm border border-white/30 text-sm font-medium mb-3 shadow-sm">
                    <Sparkles size={16} /> 
                    {nearestCity.diffDays === 0 ? "Свято сьогодні!" : nearestCity.diffDays === 1 ? "Свято завтра!" : "Найближче свято"}
                  </div>
                  <h2 className="text-3xl sm:text-4xl font-extrabold mb-2 drop-shadow-md">
                    День міста {nearestCity.name}
                  </h2>
                  <p className="text-blue-100 font-medium flex items-center gap-2 text-lg">
                    <Calendar size={18} /> {nearestCity.targetDate.getDate()} {MONTHS_GENITIVE[nearestCity.targetDate.getMonth()]}
                  </p>
                </div>
                
                <div className="flex flex-col items-center gap-3 bg-white/10 backdrop-blur-md p-5 rounded-2xl border border-white/20 min-w-[160px]">
                  <div className="text-4xl font-black drop-shadow-lg leading-none">
                    {nearestCity.diffDays}
                  </div>
                  <div className="text-blue-100 font-medium text-sm">
                    {getPluralDays(nearestCity.diffDays)}
                  </div>
                  <button 
                    onClick={() => onOpenAiGuide(nearestCity)}
                    className="mt-2 w-full px-4 py-2 bg-white text-purple-700 hover:bg-purple-50 rounded-xl font-bold transition-colors shadow-sm flex items-center justify-center gap-2 text-sm"
                  >
                    ✨ Дізнатися більше
                  </button>
                </div>
              </div>
            </motion.div>
          );
        });

        // ==========================================
        // РЕЖИМ: МІСЯЦЬ
        // ==========================================
        const MonthCalendarView = memo(({ calendarYear, calendarMonth, handlePrevMonth, handleNextMonth, setViewMode, jumpToToday, monthData, todayDateOnly, favoriteCityIds, setSelectedDayInfo }) => {
          const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
          let firstDayOffset = new Date(calendarYear, calendarMonth, 1).getDay() - 1;
          if (firstDayOffset === -1) firstDayOffset = DAYS.SATURDAY;
          const days = Array.from({ length: firstDayOffset }).fill(null).concat(Array.from({ length: daysInMonth }, (_, i) => i + 1));

          return (
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-4 sm:p-6 transition-colors">
              <div className="flex justify-between items-center mb-6">
                <div className="flex items-center gap-1 sm:gap-2">
                  <button onClick={handlePrevMonth} aria-label="Попередній місяць" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors text-slate-600 dark:text-slate-300"><ChevronLeft size={24} /></button>
                  <button onClick={jumpToToday} className="hidden sm:block px-3 py-1.5 text-sm font-semibold bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 rounded-lg hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors">Сьогодні</button>
                </div>
                <div className="flex flex-col items-center">
                  <h2 
                    className="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white capitalize text-center cursor-pointer hover:text-[#0057b7] dark:hover:text-[#4da3ff] transition-colors tracking-tight focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0057b7] rounded"
                    onClick={() => setViewMode('year')}
                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') setViewMode('year'); }}
                    tabIndex={0}
                    title="Віддалити до огляду року"
                  >
                    {new Date(calendarYear, calendarMonth).toLocaleString('uk-UA', { month: 'long', year: 'numeric' })}
                  </h2>
                  <button onClick={jumpToToday} className="sm:hidden text-xs text-blue-600 dark:text-blue-400 font-medium mt-1 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded-md transition-colors">Сьогодні</button>
                </div>
                <button onClick={handleNextMonth} aria-label="Наступний місяць" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors text-slate-600 dark:text-slate-300"><ChevronRight size={24} /></button>
              </div>
              
              <div className="grid grid-cols-7 gap-1 sm:gap-4 mb-2">
                {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].map(d => <div key={d} className="text-center font-semibold text-slate-400 dark:text-slate-500 text-xs sm:text-sm py-2">{d}</div>)}
              </div>
              
              <div className="grid grid-cols-7 gap-1 sm:gap-3">
                {days.map((dayNum, i) => {
                  if (!dayNum) return <div key={i} className="min-h-[80px] sm:min-h-[110px] rounded-xl border bg-transparent border-transparent"></div>;
                  
                  const isToday = todayDateOnly.getFullYear() === calendarYear && todayDateOnly.getMonth() === calendarMonth && todayDateOnly.getDate() === dayNum;
                  const dayCities = monthData[dayNum] || [];
                  const hasFavorite = dayCities.some(c => favoriteCityIds.includes(c.id));
                  
                  return (
                    <motion.div 
                      key={i} 
                      whileHover={{ scale: 1.02 }}
                      onClick={() => {
                        if (dayCities.length > 0) {
                          const monthName = new Date(calendarYear, calendarMonth).toLocaleString('uk-UA', { month: 'long' });
                          setSelectedDayInfo({ day: dayNum, monthName, cities: dayCities });
                        }
                      }}
                      className={`min-h-[80px] sm:min-h-[110px] rounded-xl border p-1.5 sm:p-3 relative flex flex-col transition-colors cursor-pointer hover:bg-white dark:hover:bg-slate-700/80 ${
                        isToday ? 'bg-blue-50/40 dark:bg-blue-900/20 border-blue-300 dark:border-blue-700/50 ring-1 ring-blue-300 dark:ring-blue-700/50 shadow-sm' 
                        : hasFavorite ? 'bg-yellow-50/30 dark:bg-yellow-900/10 border-[#ffd700]/70 dark:border-[#ffd700]/50 hover:border-[#ffd700]'
                        : 'bg-slate-50 dark:bg-slate-800/50 border-slate-100 dark:border-slate-700 hover:border-[#ffd700]/50'
                      }`}
                    >
                      <span className={`text-xs sm:text-sm font-bold w-6 h-6 sm:w-7 sm:h-7 flex items-center justify-center rounded-full mb-1 sm:mb-2 transition-colors ${
                        isToday ? 'bg-blue-600 text-white shadow-md ring-4 ring-blue-100 dark:ring-blue-900/30' 
                        : hasFavorite ? 'bg-gradient-to-br from-[#ffd700] to-yellow-500 text-yellow-950 shadow-md ring-2 ring-yellow-400/30'
                        : (dayCities.length > 0 ? 'bg-[#0057b7] dark:bg-[#004a99] text-white shadow-sm' : 'text-slate-500 dark:text-slate-400')
                      }`}>
                        {dayNum}
                      </span>
                      <div className="flex flex-col gap-1 overflow-y-auto hide-scrollbar flex-1 pointer-events-none">
                        {dayCities.map(city => {
                          const isFav = favoriteCityIds.includes(city.id);
                          return (
                            <div key={city.id} className={`text-[10px] sm:text-xs border rounded px-1 sm:px-1.5 py-0.5 sm:py-1 shadow-sm font-medium truncate transition-colors flex items-center gap-1 ${
                              isFav ? 'bg-yellow-50 dark:bg-yellow-900/30 border-[#ffd700]/70 text-yellow-800 dark:text-yellow-200' 
                              : 'bg-white dark:bg-slate-800 border-[#ffd700]/40 dark:border-[#ffd700]/20 text-slate-800 dark:text-slate-200'
                            }`} title={city.name}>
                              {isFav && <Star size={10} fill="currentColor" className="text-[#ffd700] flex-shrink-0" />}
                              <span className="truncate">{city.name}</span>
                            </div>
                          );
                        })}
                      </div>
                    </motion.div>
                  );
                })}
              </div>
            </div>
          );
        });

        // ==========================================
        // РЕЖИМ: РІК
        // ==========================================
        const YearCalendarView = memo(({ calendarYear, handlePrevYear, handleNextYear, setCalendarMonth, setViewMode, jumpToToday, todayDateOnly, yearGrid, favoriteCityIds, setSelectedDayInfo }) => {
          return (
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-4 sm:p-6 transition-colors relative">
              <div className="flex justify-between items-center mb-8">
                <div className="flex items-center gap-2">
                  <button onClick={handlePrevYear} aria-label="Попередній рік" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors text-slate-600 dark:text-slate-300"><ChevronLeft size={24} /></button>
                  <button onClick={jumpToToday} className="hidden sm:block px-3 py-1.5 text-sm font-semibold bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 rounded-lg hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors">Цей рік</button>
                </div>
                <div className="flex flex-col items-center">
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-800 dark:text-white text-center transition-colors tracking-tight">{calendarYear}</h2>
                  <button onClick={jumpToToday} className="sm:hidden text-xs text-blue-600 dark:text-blue-400 font-medium mt-1 bg-blue-50 dark:bg-blue-900/30 px-2 py-1 rounded-md transition-colors">Цей рік</button>
                </div>
                <button onClick={handleNextYear} aria-label="Наступний рік" className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors text-slate-600 dark:text-slate-300"><ChevronRight size={24} /></button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                {Array.from({ length: 12 }).map((_, m) => {
                  const monthName = new Date(calendarYear, m).toLocaleString('uk-UA', { month: 'long' });
                  const daysInMonth = new Date(calendarYear, m + 1, 0).getDate();
                  let firstDayOffset = new Date(calendarYear, m, 1).getDay() - 1;
                  if (firstDayOffset === -1) firstDayOffset = DAYS.SATURDAY;
                  
                  const isCurrentMonth = todayDateOnly.getFullYear() === calendarYear && todayDateOnly.getMonth() === m;
                  const monthData = yearGrid[m];
                  const eventsCount = Object.keys(monthData).reduce((sum, key) => sum + monthData[key].length, 0);

                  return (
                    <motion.div 
                      key={m} 
                      whileHover={{ scale: 1.03 }}
                      onClick={() => { setCalendarMonth(m); setViewMode('month'); }}
                      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { setCalendarMonth(m); setViewMode('month'); } }}
                      tabIndex={0}
                      role="button"
                      aria-label={`Відкрити ${monthName}`}
                      className={`group cursor-pointer p-4 rounded-2xl border transition-colors duration-300 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#0057b7] ${
                        isCurrentMonth 
                          ? 'bg-blue-50/50 dark:bg-blue-900/20 border-blue-400 dark:border-blue-500 shadow-md ring-1 ring-blue-400 dark:ring-blue-500' 
                          : 'bg-slate-50 dark:bg-slate-800/50 border-slate-100 dark:border-slate-700 hover:bg-white dark:hover:bg-slate-700 hover:border-[#0057b7]/30 dark:hover:border-[#4da3ff]/50 hover:shadow-md'
                      }`}
                    >
                      <div className="flex justify-between items-center mb-3">
                        <h3 className={`font-bold capitalize transition-colors ${
                          isCurrentMonth ? 'text-[#0057b7] dark:text-[#4da3ff]' : 'text-slate-700 dark:text-slate-300 group-hover:text-[#0057b7] dark:group-hover:text-[#4da3ff]'
                        }`}>{monthName}</h3>
                        {eventsCount > 0 && (
                          <span className="text-[10px] font-bold bg-blue-100 dark:bg-slate-700/50 text-[#0057b7] dark:text-[#4da3ff] px-1.5 py-0.5 rounded transition-colors group-hover:bg-blue-200 dark:group-hover:bg-slate-600" aria-label={`${eventsCount} подій`}>
                            {eventsCount}
                          </span>
                        )}
                      </div>
                      <div className="grid grid-cols-7 gap-1 text-[9px] sm:text-[10px] text-center mb-1.5 text-slate-400 dark:text-slate-500 font-semibold">
                        {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].map(d => <div key={d}>{d}</div>)}
                      </div>
